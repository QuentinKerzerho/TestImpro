<html lang="fr">
<head>
<meta charset="UTF-8">

<title>En Scène ! — Jeu d'impro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4fb;
    --surface:#ffffff;
    --surface-2:#f1ecfb;
    --border:#ece8f5;
    --text:#171321;
    --muted:#8d889c;
    --accent:#8b5cf6;
    --accent-soft:#efe7ff;
    --font:'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;}
  .wrap{
    max-width:460px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:0 0 40px;
  }
  header{
    position:relative;
    text-align:center;
    padding:36px 20px 10px;
  }
  .back-btn{
    display:none;
    position:absolute; left:16px; top:28px;
    width:38px; height:38px; border-radius:50%;
    background:var(--surface); color:var(--accent);
    border:1.5px solid var(--border);
    box-shadow:0 4px 10px rgba(139,92,246,0.15);
    align-items:center; justify-content:center; cursor:pointer;
  }
  .wrap:not(.is-home) .back-btn{ display:flex; }
  header h1{
    font-family:var(--font);
    font-weight:800;
    font-size:1.6rem;
    margin:0;
    letter-spacing:-0.3px;
    color:var(--text);
  }
  header p{
    margin:6px 0 0;
    font-size:0.82rem;
    color:var(--muted);
    letter-spacing:0.3px;
  }
  main{
    flex:1;
    padding:16px 20px 8px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:22px;
    padding:26px 22px;
    box-shadow:0 10px 28px rgba(139,92,246,0.08);
  }
  .eyebrow{
    font-family:var(--font);
    font-size:0.72rem;
    font-weight:700;
    letter-spacing:1.2px;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 8px;
  }
  h2{
    font-family:var(--font);
    font-weight:800;
    font-size:1.35rem;
    margin:0 0 12px;
    color:var(--text);
    letter-spacing:-0.3px;
  }
  p.lead{ line-height:1.6; color:var(--text); opacity:0.75; margin:0 0 4px;}
  .muted{ color:var(--muted); font-size:0.88rem; }

  button{
    font-family:var(--font);
    font-weight:700;
    font-size:0.96rem;
    border:none;
    border-radius:999px;
    padding:15px 20px;
    cursor:pointer;
    transition:opacity .12s ease, transform .1s ease;
  }
  button:active{ transform:scale(0.98); }
  .btn-primary{
    background:var(--accent);
    color:#fff;
    box-shadow:0 8px 20px rgba(139,92,246,0.32);
  }
  .btn-primary:hover{ opacity:0.92; }
  .btn-ghost{
    background:var(--surface-2);
    color:var(--accent);
    border:none;
  }
  .btn-block{ width:100%; }
  .btn-row{ display:flex; gap:10px; }
  .btn-row button{ flex:1; }

  .stepper{ display:flex; align-items:center; justify-content:center; gap:22px; margin:8px 0 4px; }
  .stepper button{ width:42px; height:42px; border-radius:14px; padding:0; font-size:1.2rem; background:var(--accent-soft); color:var(--accent); }
  .stepper .count{ font-family:var(--font); font-weight:800; font-size:1.8rem; min-width:36px; text-align:center; color:var(--text);}

  .player-row{ display:flex; gap:8px; align-items:center; margin-bottom:10px; }
  .player-row input[type=text]{
    flex:1; background:var(--surface-2); border:1px solid transparent;
    color:var(--text); border-radius:14px; padding:11px 13px; font-family:var(--font); font-size:0.94rem;
  }
  .pill-group{ display:flex; gap:6px; }
  .pill{
    font-family:var(--font); font-size:0.76rem; font-weight:700; padding:8px 11px; border-radius:10px;
    border:none; background:var(--surface-2); color:var(--muted); cursor:pointer;
  }
  .pill.active{ background:var(--accent); color:#fff; }

  .spotlight-wrap{
    position:relative; display:flex; align-items:center; justify-content:center;
    padding:30px 10px; border-radius:16px;
    background:var(--accent-soft);
  }
  .spotlight-wrap.pulse::before{
    content:''; width:10px; height:10px; border-radius:50%;
    background:var(--accent);
    animation:pulseDot 1.4s ease-in-out infinite;
  }
  @keyframes pulseDot{ 0%,100%{ opacity:0.3; transform:scale(0.85);} 50%{ opacity:1; transform:scale(1.15);} }
  .reveal-card{
    animation:revealIn .3s ease;
    text-align:center;
  }
  @keyframes revealIn{ from{ opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .role-name{ font-family:var(--font); font-weight:800; font-size:1.2rem; color:var(--accent); margin:2px 0 10px;}
  .objective-box{
    background:var(--accent-soft); border-left:3px solid var(--accent); border-radius:12px;
    padding:12px 14px; text-align:left; font-size:0.9rem; line-height:1.5; margin-top:8px; color:var(--text);
  }

  .score-table{ width:100%; border-collapse:collapse; margin-top:6px;}
  .score-table td{ padding:9px 4px; border-bottom:1px solid var(--border); font-family:var(--font); font-size:0.9rem;}
  .score-table td.rank{ color:var(--accent); width:24px; }
  .score-table td.total{ text-align:right; color:var(--text); font-weight:700;}

  .name-choices{ display:flex; flex-direction:column; gap:8px; margin-top:10px;}
  .name-choices button{ background:var(--surface-2); color:var(--text); border:none; text-align:left; border-radius:14px; font-family:var(--font); font-weight:700;}
  .name-choices button.selected{ background:var(--accent); color:#fff;}

  .wrap.is-home header{ display:none; }
  .home-screen{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:20px 20px 0; gap:6px;
  }
  .home-logo{
    width:88px; height:88px; border-radius:26px;
    background:linear-gradient(135deg, var(--accent), #6d3ff0);
    display:flex; align-items:center; justify-content:center;
    font-size:2.4rem; margin-bottom:18px;
    box-shadow:0 12px 28px rgba(139,92,246,0.35);
  }
  .home-title{ font-family:var(--font); font-weight:800; font-size:2rem; letter-spacing:-0.5px; margin:0; color:var(--text); }
  .home-tagline{ color:var(--muted); font-size:0.95rem; margin:8px 0 34px; }
  .btn-play{
    font-family:var(--font); font-weight:800; font-size:1.15rem; letter-spacing:0.5px;
    background:var(--accent); color:#fff; border:none; border-radius:999px;
    padding:20px 64px; box-shadow:0 12px 26px rgba(139,92,246,0.38); cursor:pointer;
  }
  .btn-play:active{ transform:scale(0.97); }
  .social-row{ display:flex; gap:14px; justify-content:center; padding:24px 20px 30px; }
  .social-row a{
    width:38px; height:38px; border-radius:50%; background:var(--surface-2);
    display:flex; align-items:center; justify-content:center; color:var(--accent);
    text-decoration:none;
  }

  footer{ text-align:center; padding:10px 20px 0; }
</style>
</head>

  context:"Il est 14h dans l'open space de l'agence. Tout semblait normal jusqu'à ce qu'un cri retentisse près de la salle de réunion : quelqu'un a fait caca par terre, en plein couloir. Personne n'a rien vu, personne n'avoue — mais l'odeur, elle, ne ment pas. La responsable RH a fermé la porte à clé et réuni tout le monde dans la salle de pause pour tirer ça au clair, avant que la direction n'arrive pour sa visite surprise dans dix minutes.",
  start:"La scène commence quand quelqu'un demande, plein d'aplomb, qui a bien pu faire une chose pareille.",
  roles:[
    {m:"Le stagiaire trop parfait", f:"La stagiaire trop parfaite", obj:"Défends-toi en expliquant pourquoi tu traînais près de la salle de pause à ce moment précis."},
    {m:"Le responsable RH sous pression", f:"La responsable RH sous pression", obj:"Explique pourquoi on ne t'a pas trouvé(e) pendant dix bonnes minutes tout à l'heure."},
    {m:"Le collègue tout le temps au téléphone", f:"La collègue tout le temps au téléphone", obj:"Justifie l'appel mystérieux que tu as reçu juste avant que ça arrive."},
    {m:"Le petit nouveau qui veut bien faire", f:"La petite nouvelle qui veut bien faire", obj:"Explique pourquoi tu avais l'air si pressé(e) il y a un instant."},
    {m:"Le collègue qui mange bizarrement à son bureau", f:"La collègue qui mange bizarrement à son bureau", obj:"Justifie ce que tu avais dans les mains il y a dix minutes."},
    {m:"Le stagiaire toujours en retard", f:"La stagiaire toujours en retard", obj:"Explique pourquoi tu es encore arrivé(e) en retard aujourd'hui."}
  ]
};
const CULPRIT_SECRET = "En plus de ton alibi : tu es LE/LA COUPABLE. Glisse un détail bizarrement précis sur l'endroit ou l'heure exacte — sans que ça se voie trop.";
const CLUES = [
  "Indice : la porte de la salle de pause était fermée à 13h50.",
  "Indice : quelqu'un s'est lavé les mains bien plus longtemps que d'habitude.",
  "Indice : quelqu'un est resté enfermé aux toilettes plus de dix minutes ce matin.",
  "Indice : le distributeur de papier du 2e étage était vide ce matin.",
  "Indice : quelqu'un a discrètement vaporisé du parfum dans le couloir juste avant le cri."
];
const FINAL_CARD = "La direction arrive dans 30 secondes. Il faut trancher MAINTENANT.";

// ---------- MODE DÉBAT (contenu de test) ----------
const DEBATE_TOPICS = [
  "Le ketchup, est-ce que c'est une soupe ?",
  "Les pigeons sont-ils des espions du gouvernement ?",
  "Faut-il mettre l'ananas sur la pizza ?",
  "Le lundi devrait-il être interdit par la loi ?",
  "Les licornes existent-elles, juste très bien cachées ?",
  "Faut-il un couloir de gauche obligatoire dans les escalators ?",
  "Le petit-déjeuner devrait-il être interdit après midi ?",
  "Les chats complotent-ils contre l'humanité ?",
  "Marcher pieds nus chez soi, génie ou anarchie ?",
  "Faut-il bannir les gens qui répondent \"vu\" sans répondre ?"
];
const DEBATER_PERSONAS = [
  {m:"L'expert autoproclamé", f:"L'experte autoproclamée", obj:"Invente des statistiques et des études qui n'existent pas, avec un aplomb total."},
  {m:"Le sceptique dramatique", f:"La sceptique dramatique", obj:"Prends la moindre objection comme une trahison personnelle."},
  {m:"Le fan inconditionnel", f:"La fan inconditionnelle", obj:"Ramène tout à une anecdote personnelle, même hors sujet."},
  {m:"Le calme suspect", f:"La calme suspecte", obj:"Reste étonnamment zen, comme si tu savais déjà que tu avais gagné."},
  {m:"Le faux neutre", f:"La fausse neutre", obj:"Prétends vouloir entendre les deux côtés, tout en penchant clairement pour ton camp."},
  {m:"Le fougueux", f:"La fougueuse", obj:"Hausse le ton dès qu'on te contredit, même à peine."}
];

// ---------- STATE ----------
let state = {
  screen:'home',
  mode:'classic', // 'classic' | 'enquete'
  players:[], // {name, gender}
  scenario:null,
  assignments:[], // {name, role, objective}
  culpritName:null,
  clueIndex:0,
  suspicionVotes:{},
  voteIndex:0,
  debateTopic:'',
  judgeName:null,
  debateWinner:null,
  revealIndex:0,
  lastWordIndex:0,
  eventText:'',
  autoTimer:null
};

function initPlayers(n){
  const arr=[];
  for(let i=0;i<n;i++){
    arr.push(state.players[i] || {name:'', gender:'n'});
  }
  state.players = arr;
}
initPlayers(3);

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

function generateStory(){
  if(state.mode === 'debate'){
    const shuffledPlayers = shuffle(state.players.map((p,i)=>{
      const name = p.name.trim() || ('Joueur ' + (i+1));
      return { name, gender:p.gender };
    }));
    const judge = shuffledPlayers[0];
    const debaters = shuffledPlayers.slice(1);
    const personas = shuffle(DEBATER_PERSONAS).slice(0, debaters.length);
    const assignments = debaters.map((p,i)=>{
      const persona = personas[i % personas.length];
      const roleText = p.gender==='f' ? persona.f : persona.m;
      const team = i % 2 === 0 ? 'pour' : 'contre';
      return { name:p.name, isJudge:false, team, role:roleText, objective:persona.obj };
    });
    assignments.push({ name:judge.name, isJudge:true, team:null, role:'Juge', objective:'' });
    // le juge doit être révélé en dernier pour clore le tour de révélation
    const judgeIdx = assignments.findIndex(a=>a.isJudge);
    const [judgeEntry] = assignments.splice(judgeIdx,1);
    assignments.push(judgeEntry);

    state.debateTopic = pick(DEBATE_TOPICS);
    state.judgeName = judge.name;
    state.assignments = assignments;
    state.revealIndex = 0;
    state.debateWinner = null;
    return;
  }
  if(state.mode === 'enquete'){
    const scenario = ENQUETE_SCENARIO;
    const roles = shuffle(scenario.roles).slice(0, state.players.length);
    const assignments = state.players.map((p, i)=>{
      const roleObj = roles[i];
      const roleText = p.gender==='f' ? roleObj.f : roleObj.m;
      const name = p.name.trim() || ('Joueur ' + (i+1));
      return { name, role: roleText, objective: roleObj.obj, isCulprit:false };
    });
    const culpritIdx = Math.floor(Math.random()*assignments.length);
    assignments[culpritIdx].isCulprit = true;
    state.scenario = scenario;
    state.assignments = assignments;
    state.culpritName = assignments[culpritIdx].name;
    state.revealIndex = 0;
    state.clueIndex = 0;
    state.voteIndex = 0;
    state.suspicionVotes = {};
    assignments.forEach(a=> state.suspicionVotes[a.name] = 0);
    state.totalDraws = 3 + Math.floor(Math.random()*3); // 3 à 5 tirages, le dernier stoppe tout
    state.drawCount = 0;
    return;
  }
  const scenario = pick(SCENARIOS);
  const roles = shuffle(scenario.roles).slice(0, state.players.length);
  const assignments = state.players.map((p, i)=>{
    const roleObj = roles[i];
    const roleText = p.gender==='f' ? roleObj.f : roleObj.m;
    const name = p.name.trim() || ('Joueur ' + (i+1));
    return { name, role: roleText, objective: roleObj.obj };
  });
  state.scenario = scenario;
  state.assignments = assignments;
  state.revealIndex = 0;
  state.lastWordIndex = 0;
  state.totalDraws = 3 + Math.floor(Math.random()*4); // 3 à 6 tirages avant la carte fatale
  state.drawCount = 0;
}

function goto(screen){ state.screen = screen; render(); }

// ---------- RENDER ----------
function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  document.querySelector('.wrap').classList.toggle('is-home', state.screen === 'home');
  const view = VIEWS[state.screen];
  app.appendChild(view());
}

function el(html){
  const div = document.createElement('div');
  div.innerHTML = html.trim();
  return div.firstElementChild;
}

  ready(){
    const isEnquete = state.mode === 'enquete';

  context(){

        <div class="card">

    `);

    c.querySelector('#showBtn').onclick = ()=>{
      let inner;
      if(state.mode === 'debate'){
        if(a.isJudge){
          inner = `
            <div class="reveal-card">
              <p class="eyebrow">Ton rôle</p>
              <p class="role-name">⚖️ Tu es LE JUGE</p>

          const teamLabel = a.team === 'pour' ? 'Camp POUR' : 'Camp CONTRE';
          inner = `
            <div class="reveal-card">
              <p class="eyebrow">${teamLabel}</p>
              <p class="role-name">${a.role}</p>
              <div class="objective-box"><strong>Ta petite manie :</strong><br>${a.objective}</div>
            </div>`;
        }
      } else {
        const label = state.mode==='enquete' ? 'Ton alibi à défendre' : 'Objectif secret';
        const culpritBox = (state.mode==='enquete' && a.isCulprit)
          ? `<div class="objective-box" style="margin-top:8px; border-color:#e0533d;"><strong>🤫 Secret :</strong><br>${CULPRIT_SECRET}</div>`
          : '';
        inner = `
          <div class="reveal-card">
            <p class="eyebrow">Ton rôle</p>
            <p class="role-name">${a.role}</p>
            <div class="objective-box"><strong>${label} :</strong><br>${a.objective}</div>

          </div>`;

  scene(){
    if(state.mode === 'enquete') return VIEWS.sceneEnquete();
    if(state.mode === 'debate') return VIEWS.sceneDebate();

    const c = el(`
      <div class="card" style="text-align:center;">
        <p class="eyebrow">🎬 La scène continue</p>
        <h2>Improvisez !</h2>
        <div class="spotlight-wrap pulse" id="spot" style="min-height:110px;"></div>
        <button class="btn-primary btn-block" id="draw" style="margin-top:14px;">🂠 Tirer la carte</button>
        <p class="muted" style="margin-top:8px;">Une carte peut tomber à tout moment...</p>
      </div>
    `);
    const spot = c.querySelector('#spot');
    const drawBtn = c.querySelector('#draw');

    function scheduleAuto(){
      const delay = 18000 + Math.random()*17000; // 18s–35s
      state.autoTimer = setTimeout(doDraw, delay);
    }

    function doDraw(){
      if(state.screen !== 'scene') return;
      clearTimeout(state.autoTimer);
      state.drawCount++;
      if(state.drawCount >= state.totalDraws){
        state.eventText = pick(ENDINGS);
        goto('event');
        return;
      }
      drawBtn.disabled = true;
      spot.innerHTML = `
        <div class="reveal-card">
          <p class="role-name">🂠 Fausse alerte</p>
          <p class="lead" style="margin:0;">Rien ne se passe... pour l'instant.</p>
        </div>`;
      setTimeout(()=>{
        if(state.screen !== 'scene') return;
        spot.innerHTML = '';
        drawBtn.disabled = false;
        scheduleAuto();
      }, 1700);
    }

    drawBtn.onclick = doDraw;
    scheduleAuto();
    return c;
  },

  sceneEnquete(){
    const c = el(`
      <div class="card" style="text-align:center;">
        <p class="eyebrow">🕵️ L'enquête continue</p>
        <h2>Improvisez !</h2>
        <div class="spotlight-wrap pulse" id="spot" style="min-height:110px;"></div>
        <p class="muted" style="margin-top:8px;">Des indices vont tomber tout seuls...</p>
      </div>
    `);
    const spot = c.querySelector('#spot');

    function scheduleAuto(){
      const delay = 9000 + Math.random()*7000; // 9s–16s, automatique, pas de bouton
      state.autoTimer = setTimeout(doDraw, delay);
    }

    function doDraw(){
      if(state.screen !== 'scene') return;
      clearTimeout(state.autoTimer);
      state.drawCount++;
      if(state.drawCount >= state.totalDraws){
        state.eventText = FINAL_CARD;
        goto('event');
        return;
      }
      const clue = CLUES[state.clueIndex % CLUES.length];
      state.clueIndex++;
      spot.innerHTML = `
        <div class="reveal-card">
          <p class="role-name">🂠 Nouvel indice</p>
          <p class="lead" style="margin:0;">${clue}</p>
        </div>`;
      setTimeout(()=>{
        if(state.screen !== 'scene') return;
        spot.innerHTML = '';
        scheduleAuto();
      }, 2600);
    }

    scheduleAuto();
    return c;
  },

  },

    const c = el(`
      <div class="card reveal-card" style="text-align:center;">
        <p class="eyebrow">🛑 Fin de la scène</p>
        <h2>${state.eventText}</h2>
        <p class="lead">${isEnquete ? "C'est le moment de désigner le/la coupable." : "Chacun aura droit à une seule phrase pour clore son personnage. Pas plus."}</p>
        <button class="btn-primary btn-block" id="next" style="margin-top:14px;">${isEnquete ? "Passer au vote →" : "Tour de dernière phrase →"}</button>
      </div>
    `);
    c.querySelector('#next').onclick = ()=> goto(isEnquete ? 'accuse' : 'lastword');
    return c;
  },

  accuse(){
    const i = state.voteIndex;
    const voter = state.assignments[i];
    const others = state.assignments.filter(a=> a.name !== voter.name);
    const choices = others.map(o=> `<button class="choice" data-name="${o.name}">${o.name}</button>`).join('');
    const c = el(`
      <div class="card" style="text-align:center;">
        <p class="eyebrow">Vote ${i+1} / ${state.assignments.length}</p>
        <h2>📱 ${voter.name}</h2>
        <p class="lead">Selon toi, qui est le/la coupable ?</p>
        <div class="name-choices">${choices}</div>
      </div>
    `);
    c.querySelectorAll('.choice').forEach(btn=>{
      btn.onclick = ()=>{
        state.suspicionVotes[btn.dataset.name] = (state.suspicionVotes[btn.dataset.name]||0) + 1;
        if(i+1 < state.assignments.length){ state.voteIndex++; render(); }
        else { goto('revealCulprit'); }
      };
    });
    return c;
  },

  revealCulprit(){
    const sorted = [...state.assignments].sort((a,b)=> (state.suspicionVotes[b.name]||0) - (state.suspicionVotes[a.name]||0));
    const rows = sorted.map(a=> `
      <tr>
        <td>${a.name}${a.name===state.culpritName ? ' 🎯' : ''}</td>
        <td style="text-align:right;">${state.suspicionVotes[a.name]||0} vote(s)</td>
      </tr>
    `).join('');
    const c = el(`
      <div class="card" style="text-align:center;">
        <p class="eyebrow">🎉 Révélation</p>
        <h2>Le/la coupable était... ${state.culpritName} !</h2>
        <table class="score-table" style="margin-top:10px;">${rows}</table>
        <div class="btn-row" style="margin-top:16px;">
          <button class="btn-primary" id="again">🔁 Nouvelle enquête</button>
          <button class="btn-ghost" id="home">🏠 Accueil</button>
        </div>
      </div>
    `);
    c.querySelector('#again').onclick = ()=> goto('ready');
    c.querySelector('#home').onclick = ()=> goto('home');
    return c;
  },

  lastword(){
    const i = state.lastWordIndex;
    const a = state.assignments[i];
    const isLast = i+1 === state.assignments.length;
    const c = el(`
      <div class="card" style="text-align:center;">
        <p class="eyebrow">🎤 Dernière phrase ${i+1} / ${state.assignments.length}</p>
        <h2>À toi, ${a.name}</h2>
        <p class="lead">Une seule phrase, pour clore ton personnage. Rien de plus.</p>
        <button class="btn-primary btn-block" id="next" style="margin-top:14px;">${isLast ? "C'est dit → Fin de la manche" : "C'est dit → Suivant"}</button>
      </div>
    `);
    c.querySelector('#next').onclick = ()=>{
      if(!isLast){ state.lastWordIndex++; render(); }
      else { goto('roundend'); }
    };
    return c;
  },

  roundend(){
    const c = el(`
      <div class="card" style="text-align:center;">
        <p class="eyebrow">🎉 Bravo à tous !</p>
        <h2>${state.scenario.title}</h2>
        <p class="lead">Belle scène. Prêts pour une nouvelle histoire ?</p>
        <div class="btn-row" style="margin-top:16px;">
          <button class="btn-primary" id="again">🔁 Nouvelle manche</button>
          <button class="btn-ghost" id="end">🏁 Terminer</button>
        </div>
      </div>
    `);
    c.querySelector('#again').onclick = ()=> goto('ready');
    c.querySelector('#end').onclick = ()=> goto('setup');
    return c;
  }
};
document.getElementById('backBtn').onclick = ()=> goto('home');
render();
</script>
</body>
</html>
